<div class="cv-page">
  <div class="glow glow-1" aria-hidden="true"></div>
  <div class="glow glow-2" aria-hidden="true"></div>

  <div class="toolbar no-print">
    <div class="lang-switch">
      <button type="button" class="tool-btn" (click)="langOpen.set(!langOpen())"
              aria-haspopup="listbox" [attr.aria-expanded]="langOpen()" [attr.aria-label]="t().ui.language" [title]="t().ui.language">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 21a9 9 0 100-18 9 9 0 000 18zM3 12h18M12 3c2.5 2.6 3.5 5.6 3.5 9s-1 6.4-3.5 9c-2.5-2.6-3.5-5.6-3.5-9s1-6.4 3.5-9" /></svg>
        <span class="lang-code">{{ lang().toUpperCase() }}</span>
        <svg class="caret" [class.up]="langOpen()" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 9l6 6 6-6" /></svg>
      </button>
      @if (langOpen()) {
        <ul class="lang-menu" role="listbox" [attr.aria-label]="t().ui.language">
          @for (option of langOptions; track option.code) {
            <li role="option" [attr.aria-selected]="option.code === lang()">
              <button type="button" [class.active]="option.code === lang()" (click)="chooseLang(option.code)"
                      [attr.lang]="option.code" [attr.dir]="option.code === 'ar' ? 'rtl' : 'ltr'">
                <span>{{ option.label }}</span>
                <span class="code">{{ option.code.toUpperCase() }}</span>
              </button>
            </li>
          }
        </ul>
      }
    </div>

    @if (isStandalone) {
      <button type="button" class="tool-btn" (click)="print()" [title]="t().ui.printTitle">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3v12m0 0l-4.5-4.5M12 15l4.5-4.5M4 17v2a2 2 0 002 2h12a2 2 0 002-2v-2" /></svg>
        <span>PDF</span>
      </button>
      <button type="button" class="tool-btn icon-only" (click)="toggleTheme()"
              [attr.aria-label]="isDark() ? t().ui.toLight : t().ui.toDark"
              [title]="isDark() ? t().ui.lightMode : t().ui.darkMode">
        @if (isDark()) {
          <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4" /><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4" /></svg>
        } @else {
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M21 12.8A9 9 0 1111.2 3a7 7 0 009.8 9.8z" /></svg>
        }
      </button>
    }
  </div>

  <router-outlet />

  <footer class="cv-footer no-print">
    © {{ year }} {{ t().hero.name }} · <a href="https://www.fakher.dev">fakher.dev</a>
  </footer>
</div>
