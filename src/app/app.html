<div class="cv-page">
  <div class="glow glow-1" aria-hidden="true"></div>
  <div class="glow glow-2" aria-hidden="true"></div>

  @if (isStandalone) {
    <div class="toolbar no-print">
      <button type="button" class="tool-btn" (click)="print()" title="Download as PDF">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3v12m0 0l-4.5-4.5M12 15l4.5-4.5M4 17v2a2 2 0 002 2h12a2 2 0 002-2v-2" /></svg>
        <span>PDF</span>
      </button>
      <button type="button" class="tool-btn icon-only" (click)="toggleTheme()"
              [attr.aria-label]="isDark() ? 'Switch to light mode' : 'Switch to dark mode'"
              [title]="isDark() ? 'Light mode' : 'Dark mode'">
        @if (isDark()) {
          <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4" /><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4" /></svg>
        } @else {
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M21 12.8A9 9 0 1111.2 3a7 7 0 009.8 9.8z" /></svg>
        }
      </button>
    </div>
  }

  <div class="cv-layout">
    <aside class="cv-side">
      <app-cv-hero class="rise" />
      <app-cv-languages class="rise" style="animation-delay: 80ms" />
    </aside>

    <main class="cv-main">
      <app-cv-about class="rise" style="animation-delay: 60ms" />
      <app-cv-experience class="rise" style="animation-delay: 120ms" />
      <app-cv-skills class="rise" style="animation-delay: 180ms" />
      <app-cv-education class="rise" style="animation-delay: 220ms" />
      <app-cv-creative class="rise" style="animation-delay: 260ms" />
    </main>
  </div>

  <footer class="cv-footer no-print">
    © {{ year }} Fakher Hammami · <a href="https://www.fakher.dev">fakher.dev</a>
  </footer>
</div>
