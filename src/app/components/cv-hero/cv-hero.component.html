<section class="hero section-card" appSpotlight>
  <div class="avatar-wrap">
    <span class="ring" aria-hidden="true"></span>
    <img class="avatar" src="profile.jpg" alt="Fakher Hammami" width="104" height="104" />
  </div>

  <h1 class="name">{{ name }}</h1>
  <p class="title">{{ title }}</p>

  <p class="current">
    <span class="pulse" aria-hidden="true"></span>
    <span>Currently <strong>{{ current.role }}</strong> at <strong>{{ current.company }}</strong></span>
  </p>

  <dl class="stats">
    @for (s of stats; track s.label) {
      <div class="stat">
        <dt>{{ s.label }}</dt>
        <dd>{{ s.value }}</dd>
      </div>
    }
  </dl>

  <ul class="contacts">
    @for (c of contacts; track c.icon) {
      <li>
        <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path [attr.d]="icons[c.icon]" /></svg>
        @if (c.href) {
          <a [href]="c.href"
             [attr.target]="c.external ? '_blank' : null"
             [attr.rel]="c.external ? 'noopener noreferrer' : null">{{ c.label }}</a>
        } @else {
          <span>{{ c.label }}</span>
        }
      </li>
    }
  </ul>
</section>
