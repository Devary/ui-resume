<div class="ats-page">
  <a class="back" routerLink="/">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M19 12H5M11 18l-6-6 6-6" /></svg>
    {{ t().ui.backToCv }}
  </a>

  <header class="head rise">
    <span class="chip">ATS</span>
    <h1 class="title">{{ ats().title }}</h1>
    <p class="lead">{{ ats().lead }}</p>
  </header>

  <div class="cards">
    @for (f of files; track f.code) {
      <section class="section-card card rise" appSpotlight>
        <h2 class="lang" [attr.lang]="f.code" [attr.dir]="f.dir">{{ f.name }}</h2>
        <p class="file"><bdi>Fakher-Hammami-ATS-{{ f.code.toUpperCase() }}</bdi></p>
        <div class="actions">
          <a class="dl primary" [href]="f.base + '.pdf'" [attr.download]="'Fakher-Hammami-ATS-' + f.code.toUpperCase() + '.pdf'">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 4v11M7 11l5 5 5-5M5 20h14" /></svg>
            {{ ats().pdf }}
          </a>
          <a class="dl" [href]="f.base + '.docx'" [attr.download]="'Fakher-Hammami-ATS-' + f.code.toUpperCase() + '.docx'">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 4v11M7 11l5 5 5-5M5 20h14" /></svg>
            {{ ats().docx }}
          </a>
        </div>
      </section>
    }
  </div>

  <section class="section-card notes rise" appSpotlight>
    <h2 class="notes-title">{{ ats().notesTitle }}</h2>
    <ul>
      @for (n of ats().notes; track n) {
        <li>{{ n }}</li>
      }
    </ul>
  </section>
</div>
